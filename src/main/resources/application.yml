spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: rbpo-lab3-variant27
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/news_editorial_db}
    username: ${DB_USERNAME:news_app}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
